name: Compilar APK Android 2026
on:
  push:
    branches: [android-apk-juego-movil-2026, master]
    paths: ['android/**', '.github/workflows/android-apk-2026.yml']
  pull_request:
    branches: [master]
    paths: ['android/**', '.github/workflows/android-apk-2026.yml']
  workflow_dispatch:
jobs:
  apk-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Localizar SDK Android de GitHub Actions
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -d /usr/local/lib/android/sdk
      - name: Instalar plataforma y herramientas
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK instalable de depuración
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Validar que se haya generado APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GameplayFootball-2026-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
