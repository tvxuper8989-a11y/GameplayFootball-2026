name: Godot 3D Android - validar y compilar APK
on:
  push:
    branches: [godot-android-3d-2026]
    paths: ['godot_mobile/**', '.github/workflows/godot-android-3d.yml']
  pull_request:
    branches: [master]
    paths: ['godot_mobile/**', '.github/workflows/godot-android-3d.yml']
  workflow_dispatch:

jobs:
  validar-godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Descargar Godot 4.7.2 Linux
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Importar y validar scripts GDScript
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_mobile --editor --quit
      - name: Ejecutar escena con renderizador headless
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_mobile --quit-after 10

  apk-android:
    needs: validar-godot
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -d /usr/local/lib/android/sdk
          SDKMGR=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Descargar Godot y plantilla de exportación Android
        run: |
          curl -fLsS --retry 4 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fLsS --retry 4 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -p /tmp/templates.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
      - name: Generar keystore local de depuración
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 3000 -dname "CN=Android Debug,O=GameplayFootball,C=AR"
      - name: Importar y exportar APK Godot nativa
        env:
          GODOT_ANDROID_SDK_PATH: /usr/local/lib/android/sdk
          GODOT_JAVA_HOME: ${{ env.JAVA_HOME }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.android/debug.keystore
        run: |
          mkdir -p godot_mobile/build
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_mobile --editor --quit
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_mobile --export-debug "Android" build/GameplayFootball-3D-Android.apk
          test -s godot_mobile/build/GameplayFootball-3D-Android.apk
      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: GameplayFootball-Godot-3D-Android-APK
          path: godot_mobile/build/GameplayFootball-3D-Android.apk
          retention-days: 14
