name: Comprobar temporada 2026
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probar herramientas de temporada
        run: python -m unittest discover -s tests_2026 -v
      - name: Comprobar base SQLite original
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          assert Path('data/databases/default/database.sqlite').is_file()
          with sqlite3.connect('file:data/databases/default/database.sqlite?mode=ro', uri=True) as db:
              names = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert {'teams', 'players', 'leagues'}.issubset(names)
          print('Datos originales presentes')
          PY
  compilar-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias de C++ y SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libgl1-mesa-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev \
            libopenal-dev libboost-all-dev libsqlite3-dev
      - name: Configurar CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --parallel 2
      - name: Preparar recursos
        run: cp -a data/. build/
      - name: Publicar resultado Linux
        uses: actions/upload-artifact@v4
        with:
          name: gameplayfootball-2026-linux
          path: build/
          retention-days: 7
