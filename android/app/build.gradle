plugins {
    id 'com.android.application'
}
android {
    namespace 'com.gameplayfootball.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gameplayfootball.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
